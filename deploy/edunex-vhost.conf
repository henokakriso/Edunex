    DocumentRoot /home/sergio/Documents/Edunex/public

    <Directory /home/sergio/Documents/Edunex/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/edunex-error.log
